[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sursolver"
dynamic = ["version"]
description = "Official Python captcha solver API client for reCAPTCHA v3, Cloudflare Turnstile, Cloudflare Challenge, GeeTest, DataDome, AWS WAF, Akamai, Kasada and image captchas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SurSolver" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
keywords = [
  "sursolver", "captcha", "captcha-solver", "recaptcha", "recaptcha-v3", "turnstile", "cloudflare",
  "cf-clearance", "geetest", "datadome", "aws-waf", "akamai", "kasada", "image-captcha", "asyncio",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://sursolver.com"
Documentation = "https://sursolver.com/docs/api"
Repository = "https://github.com/sursolver/sursolver-python"
Issues = "https://github.com/sursolver/sursolver-python/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff==0.17.3"]

[tool.hatch.version]
path = "src/sursolver/_version.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/sursolver"]

[tool.hatch.build.targets.sdist]
include = ["src/sursolver", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
