name: release

# One workflow: every push and pull request runs the full test job; a pushed tag vX.Y.Z also
# publishes the distributions built by that job to PyPI, but only after it has passed.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest mypy "ruff==0.17.3" build twine
      - run: python -m ruff check
      - run: python -m ruff format --check
      - run: python -m mypy
      - run: python -m pytest
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python -c "exec(open('src/sursolver/_version.py').read()); print(VERSION)")" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) and attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
